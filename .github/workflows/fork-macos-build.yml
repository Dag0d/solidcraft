# Fork-only helper (Dag0d/solidcraft): builds an Apple Silicon SolidCraft.app so the Quick Look
# extensions can be tested on a Mac without a local Rust toolchain. It lives only on test/*
# branches (a feature branch plus this one commit); it is never part of an upstream pull request.
name: Fork macOS test build

on:
  push:
    branches: ["test/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Dag0d/solidcraft'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-macos-aarch64
          # Keep the hour-long build even when a later step fails.
          cache-on-failure: true
      # Ad-hoc signed, not notarized (no APPLE_* secrets on the fork).
      - name: Build and package (Apple Silicon only)
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidcraft-macos-aarch64-${{ github.run_number }}
          path: dist/release/*.dmg
          if-no-files-found: error
          retention-days: 14
          # A .dmg is already compressed.
          compression-level: 0
